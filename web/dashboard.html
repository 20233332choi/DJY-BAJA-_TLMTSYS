<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJY Baja Pit Wall</title>
  <link rel="stylesheet" href="/djy.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    #status { color: var(--muted); font: 11px Consolas, monospace; white-space: nowrap; }
    #status.recording { color: var(--red); }
    .wall { height: calc(100vh - 64px); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0,1fr) minmax(0,1fr) 104px; background: var(--line-strong); gap: 1px; }
    .channel { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 18px 22px; background: #000; }
    .channel-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font: 12px Consolas, monospace; }
    .channel-head span:first-child { font-weight: 700; color: #d8d8d8; }
    .live-value { align-self: center; overflow: hidden; font: 800 clamp(62px, 12vw, 165px)/.88 Consolas, monospace; text-align: center; white-space: nowrap; }
    .unit { color: var(--muted); font: 12px Consolas, monospace; text-align: right; text-transform: uppercase; }
    .rpm .channel-head span:first-child, .rpm .live-value { color: var(--green); }
    .speed .channel-head span:first-child, .speed .live-value { color: var(--blue); }
    .throttle .channel-head span:first-child, .throttle .live-value { color: var(--amber); }
    .fuel .channel-head span:first-child, .fuel .live-value { color: var(--red); }
    .motion-strip { grid-column: 1 / 3; min-width: 0; display: grid; grid-template-columns: 235px repeat(4,minmax(0,1fr)); background: #000; }
    .motion-title { display: grid; grid-template-columns: 1fr 78px; align-items: center; gap: 12px; padding: 0 14px; border-right: 1px solid var(--line); color: #d5d5d5; font: 700 11px Consolas, monospace; }
    .motion-title small { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
    .g-plot { width: 72px; height: 72px; position: relative; overflow: hidden; border: 1px solid #444; border-radius: 50%; background: #020202; }
    .g-plot::before, .g-plot::after { position: absolute; background: #333; content: ""; }
    .g-plot::before { width: 1px; height: 100%; left: 50%; top: 0; }
    .g-plot::after { width: 100%; height: 1px; left: 0; top: 50%; }
    .g-ring { width: 34px; height: 34px; position: absolute; left: 50%; top: 50%; border: 1px solid #222; border-radius: 50%; transform: translate(-50%,-50%); }
    .g-dot { width: 10px; height: 10px; position: absolute; left: 50%; top: 50%; z-index: 2; border-radius: 50%; background: #c4a7ff; box-shadow: 0 0 8px rgba(196,167,255,.65); transform: translate(-50%,-50%); transition: left 80ms linear, top 80ms linear, background 120ms linear; }
    .g-axis { position: absolute; z-index: 1; color: #777; font: 8px Consolas, monospace; }
    .g-axis.x { right: 4px; top: calc(50% + 4px); }
    .g-axis.y { left: calc(50% + 4px); top: 3px; }
    .motion-cell { min-width: 0; position: relative; isolation: isolate; display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 8px; padding: 24px 16px; overflow: hidden; border-right: 1px solid var(--line); }
    .motion-label { color: var(--muted); font: 10px Consolas, monospace; }
    .motion-value { overflow: hidden; color: #ddd; font: 700 clamp(22px,3vw,38px) Consolas, monospace; text-align: right; white-space: nowrap; }
    .motion-unit { color: #666; font: 9px Consolas, monospace; }
    .motion-cell.total .motion-value { color: #c4a7ff; }
    .motion-cell > span { position: relative; z-index: 1; }
    .motion-fill { width: 100%; height: 0; position: absolute; bottom: 0; left: 0; z-index: 0; background: rgba(196,167,255,.12); transition: height 100ms linear, background 120ms linear; }
    .motion-strip.offline .motion-value { color: #555; }
    @media (max-width: 760px) {
      body { height: auto; overflow: auto; }
      .wall { height: auto; grid-template-columns: 1fr; grid-template-rows: none; }
      .channel { min-height: 190px; }
      .live-value { font-size: clamp(64px, 22vw, 120px); }
      .motion-strip { grid-column: auto; grid-template-columns: repeat(2,1fr); }
      .motion-title { grid-column: 1 / 3; min-height: 100px; border-bottom: 1px solid var(--line); }
      .motion-cell { min-height: 72px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>대자연 DJY · PIT WALL</h1><small>BAJA LIVE TELEMETRY</small></div>
    <nav class="nav"><a href="/">HOME</a><a href="/vehicle">REC</a><a href="/logs">ARCHIVE</a><span id="status">CONNECTING</span></nav>
  </header>
  <main class="wall">
    <section class="channel rpm"><div class="channel-head"><span>01 · ENGINE SPEED</span><span>ECU</span></div><div class="live-value" id="rpm">----</div><div class="unit">RPM</div></section>
    <section class="channel speed"><div class="channel-head"><span>02 · VEHICLE SPEED</span><span>GPS</span></div><div class="live-value" id="speed">--.-</div><div class="unit">km/h</div></section>
    <section class="channel throttle"><div class="channel-head"><span>03 · THROTTLE</span><span>ECU</span></div><div class="live-value" id="throttle">--</div><div class="unit">percent</div></section>
    <section class="channel fuel"><div class="channel-head"><span>04 · FUEL ADD</span><span>MAP</span></div><div class="live-value" id="fuel">+--</div><div class="unit">correction</div></section>
    <section class="motion-strip offline" id="motion-strip">
      <div class="motion-title">
        <div>PHONE IMU<small>DEVICE AXES / LINEAR ACCEL</small></div>
        <div class="g-plot" title="X/Y 가속도 벡터"><i class="g-ring"></i><i class="g-dot" id="g-dot"></i><span class="g-axis x">X</span><span class="g-axis y">Y</span></div>
      </div>
      <div class="motion-cell"><span class="motion-label">X</span><span class="motion-value" id="accel-x">--</span><span class="motion-unit">G</span></div>
      <div class="motion-cell"><span class="motion-label">Y</span><span class="motion-value" id="accel-y">--</span><span class="motion-unit">G</span></div>
      <div class="motion-cell"><span class="motion-label">Z</span><span class="motion-value" id="accel-z">--</span><span class="motion-unit">G</span></div>
      <div class="motion-cell total"><i class="motion-fill" id="total-fill"></i><span class="motion-label">TOTAL</span><span class="motion-value" id="total-g">--</span><span class="motion-unit">G</span></div>
    </section>
  </main>
  <script>
    let shown = {rpm:0, speed:0, throttle:0, fuel:0, accelX:0, accelY:0};
    const $ = id => document.getElementById(id);
    function smooth(key, target, alpha) {
      if (!Number.isFinite(target)) return null;
      if (!shown[key]) shown[key] = target;
      shown[key] += (target - shown[key]) * alpha;
      return shown[key];
    }
    async function tick() {
      try {
        const d = await fetch('/api/latest', {cache:'no-store'}).then(r => r.json());
        const rpm = smooth('rpm', d.rpm, .55);
        const throttle = smooth('throttle', d.throttle_percent, .7);
        const fuel = smooth('fuel', d.fuel_add, .75);
        const speed = d.speed_kmh == null ? null : smooth('speed', d.speed_kmh, .4);
        $('rpm').textContent = rpm == null ? '----' : Math.round(rpm);
        $('speed').textContent = speed == null ? '--.-' : speed.toFixed(1);
        $('throttle').textContent = throttle == null ? '--' : Math.round(throttle);
        $('fuel').textContent = fuel == null ? '+--' : `${Math.round(fuel) >= 0 ? '+' : ''}${Math.round(fuel)}`;
        const formatG = value => value == null ? '--' : `${value >= 0 ? '+' : ''}${value.toFixed(2)}`;
        $('accel-x').textContent = formatG(d.accel_x_g);
        $('accel-y').textContent = formatG(d.accel_y_g);
        $('accel-z').textContent = formatG(d.accel_z_g);
        $('total-g').textContent = d.total_g == null ? '--' : d.total_g.toFixed(2);
        $('motion-strip').classList.toggle('offline', d.total_g == null);
        if (d.accel_x_g != null && d.accel_y_g != null) {
          const x = smooth('accelX', d.accel_x_g, .35);
          const y = smooth('accelY', d.accel_y_g, .35);
          const limit = 1.5;
          $('g-dot').style.left = `${50 + Math.max(-1, Math.min(1, x / limit)) * 43}%`;
          $('g-dot').style.top = `${50 - Math.max(-1, Math.min(1, y / limit)) * 43}%`;
        } else {
          $('g-dot').style.left = '50%';
          $('g-dot').style.top = '50%';
        }
        const shock = d.total_g == null ? 0 : Math.min(3, d.total_g);
        $('total-fill').style.height = `${shock / 3 * 100}%`;
        const shockColor = shock >= 2 ? '#ff4d5e' : shock >= 1.35 ? '#ffc547' : '#c4a7ff';
        $('g-dot').style.background = shockColor;
        $('total-fill').style.background = `${shockColor}24`;
        $('status').textContent = `${d.recording ? '● REC' : 'STBY'} · ${d.status}`;
        $('status').classList.toggle('recording', d.recording);
      } catch (error) {
        $('status').textContent = 'SERVER OFFLINE';
      }
    }
    setInterval(tick, 80);
    tick();
  </script>
</body>
</html>
