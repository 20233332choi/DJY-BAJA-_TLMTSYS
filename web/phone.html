<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJY GPS Sender</title>
  <link rel="stylesheet" href="/djy.css">
  <style>
    main { max-width: 600px; margin: 0 auto; padding: 24px 18px; }
    .instructions { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    #start { width: 100%; height: 52px; border: 1px solid var(--blue); border-radius: 0; background: #020202; color: var(--blue); font-size: 17px; font-weight: 800; cursor: pointer; }
    #start.active { border-color: var(--red); color: var(--red); }
    .speed-block { margin-top: 18px; padding: 24px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); text-align: center; }
    .speed-label { color: var(--muted); font: 10px Consolas, monospace; }
    .speed { margin: 10px 0 4px; color: var(--blue); font: 800 clamp(86px, 27vw, 150px)/.9 Consolas, monospace; white-space: nowrap; }
    .unit { color: var(--muted); font: 12px Consolas, monospace; }
    .motion-grid { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--line-strong); }
    .motion-cell { min-width: 0; padding: 14px 8px; border-right: 1px solid var(--line); text-align: center; }
    .motion-cell:last-child { border-right: 0; }
    .motion-label { color: var(--muted); font: 9px Consolas, monospace; }
    .motion-value { margin-top: 6px; overflow: hidden; color: #ddd; font: 700 18px Consolas, monospace; white-space: nowrap; }
    #status { min-height: 110px; margin-top: 18px; padding: 12px; overflow: auto; border: 1px solid var(--line); background: #030303; color: #8d8d8d; font: 10px/1.5 Consolas, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>대자연 DJY · GPS LINK</h1><small>MOBILE SPEED TRANSMITTER</small></div>
    <nav class="nav"><a href="/">HOME</a></nav>
  </header>
  <main>
    <p class="instructions">아이폰에서는 HTTPS 주소로 접속해야 GPS와 모션 권한을 사용할 수 있습니다. 휴대폰을 차량에 단단히 고정한 뒤 시작하세요.</p>
    <button id="start">GPS + IMU 전송 시작</button>
    <section class="speed-block"><div class="speed-label">VEHICLE SPEED</div><div class="speed" id="speed">--.-</div><div class="unit">km/h</div></section>
    <section class="motion-grid">
      <div class="motion-cell"><div class="motion-label">ACCEL X</div><div class="motion-value" id="motion-x">--</div></div>
      <div class="motion-cell"><div class="motion-label">ACCEL Y</div><div class="motion-value" id="motion-y">--</div></div>
      <div class="motion-cell"><div class="motion-label">ACCEL Z</div><div class="motion-value" id="motion-z">--</div></div>
      <div class="motion-cell"><div class="motion-label">TOTAL G</div><div class="motion-value signal-blue" id="motion-total">--</div></div>
    </section>
    <pre id="status">GPS / IMU STANDBY</pre>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const speedEl = document.getElementById('speed');
    const startButton = document.getElementById('start');
    let watchId = null;
    let running = false;
    let lastMotionSent = 0;

    function numberOrNull(value) {
      return Number.isFinite(value) ? value : null;
    }

    function stopSending() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      running = false;
      window.removeEventListener('devicemotion', onMotion);
      startButton.textContent = 'GPS + IMU 전송 시작';
      startButton.classList.remove('active');
      statusEl.textContent = 'GPS / IMU STANDBY';
    }

    function onMotion(event) {
      const linear = event.acceleration || {};
      const gravity = event.accelerationIncludingGravity || {};
      const divisor = 9.80665;
      const gx = numberOrNull(gravity.x);
      const gy = numberOrNull(gravity.y);
      const gz = numberOrNull(gravity.z);
      const payload = {
        ts: Date.now() / 1000,
        accel_x_g: numberOrNull(linear.x) == null ? null : linear.x / divisor,
        accel_y_g: numberOrNull(linear.y) == null ? null : linear.y / divisor,
        accel_z_g: numberOrNull(linear.z) == null ? null : linear.z / divisor,
        total_g: gx == null || gy == null || gz == null ? null : Math.sqrt(gx*gx + gy*gy + gz*gz) / divisor
      };
      const format = value => value == null ? '--' : `${value >= 0 ? '+' : ''}${value.toFixed(2)}`;
      document.getElementById('motion-x').textContent = format(payload.accel_x_g);
      document.getElementById('motion-y').textContent = format(payload.accel_y_g);
      document.getElementById('motion-z').textContent = format(payload.accel_z_g);
      document.getElementById('motion-total').textContent = payload.total_g == null ? '--' : payload.total_g.toFixed(2);
      const now = performance.now();
      if (now - lastMotionSent >= 100) {
        lastMotionSent = now;
        fetch('/motion', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
          .catch(error => statusEl.textContent = `IMU SEND ERROR\n${error}`);
      }
    }

    startButton.onclick = async () => {
      if (!navigator.geolocation) { statusEl.textContent = 'GPS NOT SUPPORTED'; return; }
      if (running) { stopSending(); return; }
      let motionReady = typeof DeviceMotionEvent !== 'undefined';
      if (motionReady && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          motionReady = await DeviceMotionEvent.requestPermission() === 'granted';
        } catch (error) {
          motionReady = false;
        }
      }
      running = true;
      if (motionReady) window.addEventListener('devicemotion', onMotion);
      startButton.textContent = 'GPS + IMU 전송 중지';
      startButton.classList.add('active');
      statusEl.textContent = motionReady ? 'WAITING FOR GPS / IMU' : 'WAITING FOR GPS\nIMU PERMISSION DENIED OR UNSUPPORTED';
      watchId = navigator.geolocation.watchPosition(position => {
        const c = position.coords;
        const payload = {ts:Date.now()/1000, lat:c.latitude, lon:c.longitude, accuracy_m:c.accuracy, speed_kmh:c.speed == null ? null : c.speed * 3.6, heading:c.heading, altitude:c.altitude};
        speedEl.textContent = payload.speed_kmh == null ? '--.-' : payload.speed_kmh.toFixed(1);
        statusEl.textContent = `GPS LIVE / IMU ${motionReady ? 'ON' : 'OFF'}\nACCURACY  ${payload.accuracy_m.toFixed(1)} m\nLAT       ${payload.lat.toFixed(6)}\nLON       ${payload.lon.toFixed(6)}`;
        fetch('/gps', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true})
          .catch(error => statusEl.textContent = `SEND ERROR\n${error}`);
      }, error => statusEl.textContent = `GPS ERROR\n${error.message}`, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
    };
  </script>
</body>
</html>
