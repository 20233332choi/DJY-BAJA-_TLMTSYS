<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJY Baja Telemetry</title>
  <link rel="stylesheet" href="/djy.css">
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .home-head { padding: clamp(24px, 5vw, 64px) clamp(18px, 5vw, 64px) 22px; border-bottom: 1px solid var(--line-strong); }
    .home-head h1 { margin: 0; font-size: clamp(34px, 6vw, 72px); line-height: 1; letter-spacing: 0; }
    .home-head p { margin: 10px 0 0; color: var(--muted); font: 12px Consolas, monospace; }
    .menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--line-strong); gap: 1px; }
    .menu a { min-height: 190px; display: grid; grid-template-columns: 54px 1fr; grid-template-rows: 1fr auto; gap: 6px 18px; padding: 24px; background: #000; color: var(--text); text-decoration: none; }
    .menu a:hover { background: #080808; }
    .number { grid-row: 1 / 3; width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--green); font: 700 16px Consolas, monospace; }
    .menu b { align-self: end; font-size: clamp(23px, 3vw, 38px); letter-spacing: 0; }
    .menu span { color: var(--muted); font-size: 13px; }
    footer { padding: 10px 18px; border-top: 1px solid var(--line-strong); color: #666; font: 10px Consolas, monospace; }
    @media (max-width: 720px) { .menu { grid-template-columns: 1fr; } .menu a { min-height: 140px; } }
  </style>
</head>
<body>
  <header class="home-head"><h1>DJY BAJA TLMTSYS</h1><p>BAJA TELEMETRY CONTROL · PIT SYSTEM 01</p></header>
  <main class="menu">
    <a href="/vehicle"><div class="number">01</div><b>차량 to 서버</b><span>ECU 연결 상태 · 주행 기록 시작 및 종료</span></a>
    <a href="/phone"><div class="number">02</div><b>속도 전송</b><span>휴대폰 GPS · 실시간 차량 속도 송신</span></a>
    <a href="/dashboard"><div class="number">03</div><b>실시간 대시보드</b><span>RPM · 속도 · 스로틀 · 추가 연료</span></a>
    <a href="/logs"><div class="number">04</div><b>주행 기록 열람</b><span>세션별 기록 · 주행 추이 및 상세 데이터</span></a>
  </main>
  <footer>DJY BAJA / LOCAL TELEMETRY SERVER / PORT 8765</footer>
</body>
</html>
