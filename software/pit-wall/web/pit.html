<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>DJY Pit A/B</title>
  <link rel="stylesheet" href="/djy.css">
  <style>
    body { min-height: 100vh; background: #000; }
    .pit-head { padding: 22px 18px 16px; border-bottom: 1px solid var(--line-strong); }
    .pit-head h1 { margin: 0; font-size: clamp(28px, 5vw, 56px); }
    .pit-head p { margin: 8px 0 0; color: var(--muted); font: 11px Consolas, monospace; }
    .pit-nav { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .pit-nav a, .pit-tab { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; border: 1px solid var(--line-strong); background: #050505; color: #aaa; font: 800 10px Consolas, monospace; text-decoration: none; cursor: pointer; }
    .pit-nav a:hover, .pit-tab:hover { color: #fff; border-color: #777; }
    .pit-main { min-height: calc(100vh - 150px); }
    .pit-tabs { display: flex; flex-wrap: wrap; gap: 1px; padding: 10px 16px; border-bottom: 1px solid var(--line-strong); background: #020202; }
    .pit-tab { border-color: #444; }
    .pit-tab.selected { border-color: var(--green); color: var(--green); background: #031008; }
    .pit-frame-wrap { min-height: calc(100vh - 225px); background: #000; }
    #pit-frame { display: block; width: 100%; height: max(720px, calc(100vh - 225px)); border: 0; background: #000; }
    .pit-note { padding: 9px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font: 10px Consolas, monospace; }
    @media (max-width: 720px) {
      .pit-head { padding: 18px 12px 12px; }
      .pit-tabs { padding: 8px 10px; }
      .pit-note { padding: 8px 10px; }
      #pit-frame { height: max(760px, calc(100vh - 220px)); }
    }
  </style>
</head>
<body>
  <header class="pit-head">
    <h1>DJY PIT A/B</h1>
    <p>차량 A · 차량 B · GPS 랩타이밍 · 경기 타이밍 · ECU 상태</p>
    <nav class="pit-nav">
      <a href="/">HOME</a>
      <a href="/driver?source=local" target="_blank" rel="noopener">DRIVER A/B ↗</a>
      <a href="/phone?vehicle=A" target="_blank" rel="noopener">PHONE A ↗</a>
      <a href="/phone?vehicle=B" target="_blank" rel="noopener">PHONE B ↗</a>
      <a href="/map" target="_blank" rel="noopener">REAL MAP ↗</a>
      <a href="/logs">ARCHIVE</a>
    </nav>
  </header>
  <main class="pit-main">
    <div class="pit-tabs" role="tablist" aria-label="피트 화면">
      <button class="pit-tab selected" type="button" data-view="gps" role="tab">A/B GPS LAP</button>
      <button class="pit-tab" type="button" data-view="speedhive" role="tab">SPEEDHIVE</button>
      <button class="pit-tab" type="button" data-view="ecu" role="tab">ECU DASHBOARD</button>
      <button class="pit-tab" type="button" data-view="record" role="tab">RUN CONTROL</button>
    </div>
    <div class="pit-note" id="pit-note">차량 A/B GPS 상태와 랩타임을 확인합니다. 기존 화면의 출발선·피트 명령·지도 기능은 그대로 사용할 수 있습니다.</div>
    <section class="pit-frame-wrap">
      <iframe id="pit-frame" title="DJY pit view" src="/lap-timing?embed=1"></iframe>
    </section>
  </main>
  <script>
    const views = {
      gps: {url: '/lap-timing?embed=1', note: '차량 A/B GPS 상태와 랩타임을 확인합니다. 기존 화면의 출발선·피트 명령·지도 기능은 그대로 사용할 수 있습니다.'},
      speedhive: {url: '/timing?embed=1', note: 'Speedhive 라이브 순위와 트랙 플래그, A/B 대상 피트 명령을 확인합니다.'},
      ecu: {url: '/dashboard?embed=1', note: 'Rapid Bike ECU의 RPM·스로틀·연료 보정과 차량 A의 GPS/IMU 상태를 확인합니다.'},
      record: {url: '/vehicle?embed=1', note: 'ECU 연결 상태를 확인하고 주행 기록의 시작·종료를 제어합니다.'},
    };
    const frame = document.getElementById('pit-frame');
    const note = document.getElementById('pit-note');
    const tabs = [...document.querySelectorAll('[data-view]')];
    function selectView(view) {
      const selected = views[view] ? view : 'gps';
      tabs.forEach(tab => {
        const active = tab.dataset.view === selected;
        tab.classList.toggle('selected', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      frame.src = views[selected].url;
      note.textContent = views[selected].note;
      localStorage.setItem('djy_pit_view', selected);
    }
    tabs.forEach(tab => tab.addEventListener('click', () => selectView(tab.dataset.view)));
    selectView(localStorage.getItem('djy_pit_view') || 'gps');
  </script>
</body>
</html>
