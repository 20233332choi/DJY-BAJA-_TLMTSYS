<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>DJY Live Vehicle Map</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #080808; color: #fff; font-family: Consolas, monospace; }
    #map { z-index: 0; background: #171717; }
    .hud { position: fixed; z-index: 1000; top: 12px; left: 12px; right: 12px; display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 9px; border: 2px solid #fff; background: rgba(0,0,0,.92); box-shadow: 0 3px 20px rgba(0,0,0,.55); }
    .brand strong, .brand span { display: block; }
    .brand strong { color: #fff; font-size: 15px; }
    .brand span { margin-top: 3px; color: #888; font-size: 9px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 5px; }
    button { height: 34px; padding: 0 10px; border: 2px solid #555; background: #000; color: #aaa; font: 900 10px Consolas, monospace; cursor: pointer; }
    button.selected { border-color: #00ffff; color: #00ffff; }
    button[data-follow="START"].selected { border-color: #ff0000; color: #ff0000; }
    button.action { border-color: #fff; color: #fff; }
    .vehicle-readouts { display: flex; justify-content: center; gap: 7px; min-width: 0; }
    .readout { min-width: 180px; padding: 5px 9px; border-left: 5px solid; background: #090909; }
    .readout.a { border-color: #ffff00; }
    .readout.b { border-color: #00ffff; }
    .readout header { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; }
    .readout.a header { color: #ffff00; }
    .readout.b header { color: #00ffff; }
    .readout strong { display: block; margin-top: 3px; overflow: hidden; color: #fff; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .readout small { display: block; margin-top: 2px; color: #aaa; font-size: 9px; }
    .readout.offline { opacity: .45; }
    .status { position: fixed; z-index: 1000; left: 12px; bottom: 24px; max-width: calc(100% - 24px); padding: 7px 10px; border: 1px solid #555; background: rgba(0,0,0,.9); color: #ccc; font: 10px Consolas, monospace; }
    .status.error { border-color: #ff0000; color: #ff0000; }
    .vehicle-icon { position: relative; width: 52px; height: 52px; transform-origin: 26px 26px; }
    .vehicle-arrow { position: absolute; left: 17px; top: 0; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 25px solid var(--vehicle-color); filter: drop-shadow(0 0 2px #000); }
    .vehicle-dot { position: absolute; left: 11px; top: 20px; display: grid; width: 30px; height: 30px; place-items: center; border: 3px solid #000; border-radius: 50%; background: var(--vehicle-color); color: #000; font: 950 15px Consolas, monospace; box-shadow: 0 0 0 2px #fff; }
    .start-label { padding: 4px 7px; border: 2px solid #fff; background: #ff0000; color: #fff; font: 950 12px Consolas, monospace; white-space: nowrap; }
    .leaflet-control-attribution { background: rgba(255,255,255,.9) !important; }
    .history-lap { height: 34px; padding: 0 8px; border: 2px solid #00ffff; background: #000; color: #00ffff; font: 900 10px Consolas, monospace; }
    .leaflet-control-zoom { margin-top: 98px !important; }
    @media (max-width: 980px) {
      .hud { grid-template-columns: 1fr auto; }
      .vehicle-readouts { grid-column: 1 / 3; grid-row: 2; }
      .follow-buttons { grid-column: 1 / 3; }
      .leaflet-control-zoom { margin-top: 190px !important; }
    }
    @media (max-width: 560px) {
      .hud { top: 5px; left: 5px; right: 5px; }
      .brand span { display: none; }
      .target-buttons { display: none; }
      .follow-buttons { min-width: 0; max-width: 100%; overflow: hidden; }
      .follow-buttons button[data-follow="START"],
      .follow-buttons button[data-follow="B"],
      .follow-buttons button[data-follow="FREE"],
      #clear-trail { display: none; }
      .vehicle-readouts { gap: 3px; }
      .readout { min-width: 0; flex: 1; }
      .readout.b.offline { display: none; }
      .readout strong { font-size: 14px; }
      button { height: 31px; padding: 0 7px; }
      .leaflet-control-zoom { display: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <section class="hud">
    <div class="brand"><strong>DJY REAL MAP</strong><span>OPENSTREETMAP · LIVE GPS</span></div>
    <div class="buttons target-buttons"><button class="selected" data-target="ALL">ALL</button><button data-target="A">A</button><button data-target="B">B</button></div>
    <div class="vehicle-readouts">
      <article class="readout a offline" data-readout="A"><header><b>VEHICLE A</b><span data-value="state">OFFLINE</span></header><strong data-value="heading">--°</strong><small><span data-value="speed">--.- km/h</span> · <span data-value="accuracy">ACC --m</span> · <span data-value="laps">LAP 0</span></small></article>
      <article class="readout b offline" data-readout="B"><header><b>VEHICLE B</b><span data-value="state">OFFLINE</span></header><strong data-value="heading">--°</strong><small><span data-value="speed">--.- km/h</span> · <span data-value="accuracy">ACC --m</span> · <span data-value="laps">LAP 0</span></small></article>
    </div>
    <div class="buttons follow-buttons"><button data-follow="START">START</button><button class="selected" data-follow="A">FOLLOW A</button><button data-follow="B">FOLLOW B</button><button data-follow="FREE">FREE</button><select id="history-lap" class="history-lap" hidden><option value="">ALL LAPS</option></select><button class="action" id="reset-view">RESET VIEW</button><button class="action" id="clear-trail">CLEAR</button><button class="action" id="fullscreen">FULL</button></div>
  </section>
  <div class="status" id="status">MAP STARTING · INTERNET REQUIRED FOR MAP TILES</div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const colors = {A:'#ffff00', B:'#00ffff'};
    const trails = {A:[], B:[]};
    const armed = {A:false, B:false};
    const latestPoints = {A:null, B:null};
    const layers = {
      A:{group:L.layerGroup(), marker:null, accuracy:null, trail:L.polyline([], {color:colors.A, weight:5, opacity:.85})},
      B:{group:L.layerGroup(), marker:null, accuracy:null, trail:L.polyline([], {color:colors.B, weight:5, opacity:.85})},
    };
    let target = 'ALL';
    let follow = 'A';
    let gateKey = '';
    let startLayers = [];
    let firstViewSet = false;
    let loading = false;
    const mapParams = new URLSearchParams(location.search);
    const historySessionId = Number(mapParams.get('session'));
    const historyVehicleId = mapParams.get('vehicle_id') || '';
    const historical = Number.isInteger(historySessionId) && historySessionId > 0;
    let historyLap = mapParams.get('lap') || mapParams.get('lap_number') || '';
    let historicalLoaded = false;

    const map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([35.14358,126.93324], 17);
    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    tiles.on('load', () => {
      const status = document.getElementById('status');
      if (!status.classList.contains('error')) status.textContent = 'LIVE · FOLLOWING VEHICLE A';
    });
    tiles.on('tileerror', () => {
      const status = document.getElementById('status');
      status.className = 'status error';
      status.textContent = 'MAP TILE ERROR · CHECK INTERNET CONNECTION';
    });

    for (const id of ['A','B']) {
      layers[id].trail.addTo(layers[id].group);
      layers[id].group.addTo(map);
    }

    function cardinal(heading) {
      if (heading == null || !Number.isFinite(Number(heading))) return '--';
      return ['N','NE','E','SE','S','SW','W','NW'][Math.round((Number(heading)%360)/45)%8];
    }

    function offsetPoint(lat, lon, distanceM, bearingDeg) {
      const earth = 6371000;
      const bearing = bearingDeg*Math.PI/180;
      const lat1 = lat*Math.PI/180;
      const lon1 = lon*Math.PI/180;
      const angular = distanceM/earth;
      const lat2 = Math.asin(Math.sin(lat1)*Math.cos(angular)+Math.cos(lat1)*Math.sin(angular)*Math.cos(bearing));
      const lon2 = lon1+Math.atan2(Math.sin(bearing)*Math.sin(angular)*Math.cos(lat1),Math.cos(angular)-Math.sin(lat1)*Math.sin(lat2));
      return [lat2*180/Math.PI,lon2*180/Math.PI];
    }

    function vehicleIcon(id, heading) {
      const rotation = heading == null ? 0 : Number(heading);
      return L.divIcon({
        className:'',
        iconSize:[52,52],
        iconAnchor:[26,26],
        html:`<div class="vehicle-icon" style="--vehicle-color:${colors[id]};transform:rotate(${rotation}deg)"><i class="vehicle-arrow"></i><b class="vehicle-dot">${id}</b></div>`
      });
    }

    function updateReadout(id, vehicle) {
      const root = document.querySelector(`[data-readout="${id}"]`);
      root.classList.toggle('offline', !vehicle.gps_live);
      const set = (name,value) => root.querySelector(`[data-value="${name}"]`).textContent = value;
      set('state', vehicle.gps_live ? (vehicle.gps_ready ? 'READY' : `${Math.min(15,Math.floor(vehicle.gps_stable_s||0))}/15s`) : 'OFFLINE');
      set('heading', vehicle.heading == null ? '--°' : `${Math.round(vehicle.heading)}° ${cardinal(vehicle.heading)}`);
      set('speed', vehicle.speed_kmh == null ? '--.- km/h' : `${Number(vehicle.speed_kmh).toFixed(1)} km/h`);
      set('accuracy', vehicle.accuracy_m == null ? 'ACC --m' : `ACC ${Number(vehicle.accuracy_m).toFixed(1)}m`);
      set('laps', `LAP ${vehicle.lap_count}`);
    }

    function updateVehicle(id, vehicle) {
      updateReadout(id,vehicle);
      if (vehicle.gps_ready) armed[id] = true;
      if (vehicle.lat == null || vehicle.lon == null || !vehicle.gps_live) return;
      const point = [Number(vehicle.lat),Number(vehicle.lon)];
      latestPoints[id] = point;
      if (!layers[id].marker) {
        layers[id].marker = L.marker(point, {icon:vehicleIcon(id,vehicle.heading), zIndexOffset:id==='A'?300:200}).addTo(layers[id].group);
        layers[id].marker.bindTooltip(`VEHICLE ${id}`, {permanent:true, direction:'bottom', offset:[0,24]});
      } else {
        layers[id].marker.setLatLng(point).setIcon(vehicleIcon(id,vehicle.heading));
      }
      if (!layers[id].accuracy) {
        layers[id].accuracy = L.circle(point, {radius:Number(vehicle.accuracy_m)||0, color:colors[id], weight:1, opacity:.7, fillOpacity:.06}).addTo(layers[id].group);
      } else {
        layers[id].accuracy.setLatLng(point).setRadius(Number(vehicle.accuracy_m)||0);
      }
      if (armed[id]) {
        const trail = trails[id];
        const last = trail[trail.length-1];
        if (!last || Math.abs(last[0]-point[0])+Math.abs(last[1]-point[1])>1e-8) {
          trail.push(point);
          if (trail.length>3000) trail.shift();
          layers[id].trail.setLatLngs(trail);
        }
      }
      if (!firstViewSet && vehicle.gps_ready && (follow === id || !latestPoints.A)) {
        map.setView(point,18);
        firstViewSet = true;
      }
      if (follow===id) map.panTo(point,{animate:false});
    }

    function updateGate(gate) {
      if (!gate) return;
      const key = `${gate.lat},${gate.lon},${gate.heading},${gate.half_width_m}`;
      if (key===gateKey) return;
      gateKey = key;
      startLayers.forEach(layer => map.removeLayer(layer));
      startLayers = [];
      const center = [gate.lat,gate.lon];
      const left = offsetPoint(gate.lat,gate.lon,gate.half_width_m,gate.heading-90);
      const right = offsetPoint(gate.lat,gate.lon,gate.half_width_m,gate.heading+90);
      const ahead = offsetPoint(gate.lat,gate.lon,Math.max(18,gate.half_width_m*.8),gate.heading);
      startLayers.push(
        L.polyline([left,right],{color:'#fff',weight:11,opacity:1}).addTo(map),
        L.polyline([left,right],{color:'#ff0000',weight:6,opacity:1}).addTo(map),
        L.polyline([center,ahead],{color:'#ffff00',weight:6,opacity:1}).addTo(map),
        L.marker(center,{icon:L.divIcon({className:'',iconAnchor:[30,-8],html:'<b class="start-label">START</b>'}),interactive:false}).addTo(map)
      );
      if (follow==='START') {
        map.setView(center,18);
        firstViewSet = true;
      }
    }

    function renderHistorical(data) {
      const allLaps = new Set();
      for (const id of ['A','B']) {
        const rows = data.tracks?.[id] || [];
        rows.forEach(row => allLaps.add(Number(row.lap_number)));
        const points = rows
          .filter(row => Number(row.accepted) && row.filtered_lat != null && row.filtered_lon != null)
          .map(row => [Number(row.filtered_lat), Number(row.filtered_lon)]);
        trails[id].length = 0;
        trails[id].push(...points);
        layers[id].trail.setLatLngs(points);
        armed[id] = points.length > 0;
        const last = rows[rows.length - 1];
        if (last) {
          updateReadout(id, {gps_live:true, gps_ready:true, heading:last.heading, speed_kmh:last.speed_kmh, accuracy_m:last.accuracy_m, lap_count:last.lap_number});
          if (points.length) {
            const point = points[points.length - 1];
            if (!layers[id].marker) layers[id].marker = L.marker(point, {icon:vehicleIcon(id,last.heading), zIndexOffset:id==='A'?300:200}).addTo(layers[id].group);
            else layers[id].marker.setLatLng(point).setIcon(vehicleIcon(id,last.heading));
          }
        }
      }
      const select = document.getElementById('history-lap');
      select.hidden = false;
      if (select.options.length === 1) {
        [...allLaps].sort((a,b) => a-b).forEach(lap => {
          const option = document.createElement('option');
          option.value = String(lap);
          option.textContent = lap === 0 ? 'BEFORE START' : `LAP ${lap}`;
          select.append(option);
        });
        select.value = historyLap;
      }
      const points = ['A','B'].flatMap(id => trails[id]);
      if (points.length) map.fitBounds(L.latLngBounds(points), {padding:[45,45]});
      const sessionName = data.session?.name || `SESSION ${historySessionId}`;
      document.querySelector('.brand strong').textContent = `DJY TRACK · ${sessionName}`;
      document.querySelector('.brand span').textContent = historyLap ? `HISTORICAL · LAP ${historyLap}` : 'HISTORICAL GPS TRACK';
      document.getElementById('status').textContent = `SESSION ${historySessionId} · ${points.length} TRACK POINTS`;
      historicalLoaded = true;
    }

    async function loadHistorical() {
      const query = new URLSearchParams({session_id:String(historySessionId)});
      if (historyVehicleId === 'A' || historyVehicleId === 'B') query.set('vehicle_id', historyVehicleId);
      if (historyLap) query.set('lap_number', historyLap);
      const response = await fetch(`/api/track?${query}`, {cache:'no-store'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      renderHistorical(data);
    }

    function applyTarget() {
      for (const id of ['A','B']) {
        const visible = target==='ALL' || target===id;
        if (visible && !map.hasLayer(layers[id].group)) layers[id].group.addTo(map);
        if (!visible && map.hasLayer(layers[id].group)) map.removeLayer(layers[id].group);
        document.querySelector(`[data-readout="${id}"]`).style.display = visible ? '' : 'none';
      }
    }

    async function tick() {
      if (loading) return;
      if (historical && historicalLoaded) return;
      loading = true;
      try {
        if (historical) {
          await loadHistorical();
          return;
        }
        const response = await fetch('/api/lap/status',{cache:'no-store'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error||`HTTP ${response.status}`);
        updateGate(data.gate);
        updateVehicle('A',data.vehicles.A);
        updateVehicle('B',data.vehicles.B);
        document.getElementById('status').classList.remove('error');
      } catch (error) {
        const status = document.getElementById('status');
        status.className = 'status error';
        status.textContent = `SERVER OFFLINE · ${error.message}`;
      } finally {
        loading = false;
      }
    }

    document.querySelectorAll('[data-target]').forEach(button => button.onclick = () => {
      target = button.dataset.target;
      document.querySelectorAll('[data-target]').forEach(item => item.classList.toggle('selected',item.dataset.target===target));
      applyTarget();
    });
    document.querySelectorAll('[data-follow]').forEach(button => button.onclick = () => {
      follow = button.dataset.follow;
      document.querySelectorAll('[data-follow]').forEach(item => item.classList.toggle('selected',item.dataset.follow===follow));
      if (follow==='START' && gateKey) {
        const parts = gateKey.split(',').map(Number);
        map.setView([parts[0],parts[1]],18);
      }
    });
    document.getElementById('history-lap').onchange = event => {
      historyLap = event.target.value;
      historicalLoaded = false;
      tick();
    };
    document.getElementById('reset-view').onclick = () => {
      const preferred = latestPoints.A ? 'A' : (latestPoints.B ? 'B' : null);
      if (preferred) {
        follow = preferred;
        target = 'ALL';
        document.querySelectorAll('[data-follow]').forEach(item => item.classList.toggle('selected',item.dataset.follow===follow));
        document.querySelectorAll('[data-target]').forEach(item => item.classList.toggle('selected',item.dataset.target===target));
        applyTarget();
        map.setView(latestPoints[preferred],18,{animate:false});
        document.getElementById('status').textContent = `VIEW RESET · FOLLOWING VEHICLE ${preferred}`;
      } else if (gateKey) {
        follow = 'START';
        const parts = gateKey.split(',').map(Number);
        map.setView([parts[0],parts[1]],18,{animate:false});
      } else {
        map.setView([35.14358,126.93324],17,{animate:false});
      }
      firstViewSet = true;
    };
    document.getElementById('clear-trail').onclick = () => {
      for (const id of ['A','B']) { trails[id].length=0; layers[id].trail.setLatLngs([]); }
    };
    document.getElementById('fullscreen').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };
    map.on('dragstart', () => {
      follow='FREE';
      document.querySelectorAll('[data-follow]').forEach(item => item.classList.toggle('selected',item.dataset.follow==='FREE'));
    });
    setInterval(tick,200);
    tick();
  </script>
</body>
</html>
